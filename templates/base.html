<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>やることリスト</title>
  <style>
    body { font-family: sans-serif; background: #f4f6fb; margin: 0; color: #222; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
    h1 a { color: inherit; text-decoration: none; }
    .btn { display: inline-block; padding: 8px 16px; border-radius: 8px; border: none;
           background: #3b6cf6; color: #fff; text-decoration: none; cursor: pointer; font-size: 14px; }
    .btn.gray { background: #888; }
    .btn.red { background: #e5484d; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin: 12px 0;
            box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .card h2 { margin: 0 0 6px; font-size: 18px; }
    .due { color: #3b6cf6; font-size: 14px; }
    .due.over { color: #e5484d; font-weight: bold; }
    .content { white-space: pre-wrap; margin: 8px 0; }
    .actions { display: flex; gap: 8px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, textarea { width: 100%; padding: 8px; font-size: 16px; box-sizing: border-box;
                      border: 1px solid #ccc; border-radius: 8px; }
    textarea { height: 120px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1><a href="{{ url_for('index') }}">📝 やることリスト</a></h1>
    {% block body %}{% endblock %}
  </div>
</body>
</html>
