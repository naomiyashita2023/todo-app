{% extends "base.html" %}
{% block body %}
<p class="center"><a class="btn" href="{{ url_for('new') }}">＋ やることを登録</a></p>

{% for t in todos %}
<div class="card {{ 'over' if t.status == 'over' }}">
  <h2>🌷 {{ t.title }}</h2>
  <span class="due {{ t.status }}">📅 {{ t.due_label }}</span>
  <div class="content">{{ t.content }}</div>
  <div class="actions">
    <a class="btn small blue" href="{{ url_for('edit', todo_id=t.id) }}">編集</a>
    <form method="post" action="{{ url_for('delete', todo_id=t.id) }}"
          onsubmit="return confirm('本当に消しますか？')">
      <button class="btn small red">削除</button>
    </form>
  </div>
</div>
{% else %}
<p class="empty">まだ やることは ありません ☁️<br>上のボタンから登録してね</p>
{% endfor %}
{% endblock %}
